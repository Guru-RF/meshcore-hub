# meshcore-hubd configuration for be.mesh73.net.
# This file is the source of truth: edit it here and run deploy/deploy.sh.
# deploy.sh installs it as /etc/meshcore-hub/hub.toml. If only this file
# changed, the hub reloads (SIGHUP): the allowlist, [map] and the channels
# apply without dropping sessions. Other settings here need a restart:
# RESTART=1 deploy/deploy.sh

listen = "0.0.0.0:4405"
hub_key = "/etc/meshcore-hub/hub.key"
database = "/var/lib/meshcore-hub/hub.db"
events_socket = "/run/meshcore-hub/events.sock"

# Repeaters are green on the map, hotspots violet. Each node reports which it
# is in STATUS "role" (docs/backbone.md, "Hotspots"), and the map shows that.
# Until its first STATUS the hub guesses from the callsign: a bare call
# starting with one of these is a repeater; a personal or vanity call, or any
# call with an SSID (OR7F-4), is a hotspot. The hub logs a disagreement.
repeater_prefixes = ["ON0"]

# Intervals handed to repeaters in WELCOME (docs/backbone.md, "Timers").
[timing]
keepalive_s = 25
status_s = 60
neighbours_s = 300

[bridge]
hold_ms = 1000          # wait for other islands' reports before fanning out
rate_per_min = 25       # FRAMEs per repeater per minute (repeaters cap at 30)
own_replies = false     # don't carry pong/help/time/probe/#mbox replies across islands
dedup_s = 600
path_memory_h = 24

[retention]
frames_days = 14
messages_days = 180
history_days = 90

# The hub on the map, with a dashed IP line to every connected node. Reloads
# with the allowlist.
[map]
hub_name = "IP-HUB"
hub_position = [50.4697, 3.8653]   # Google Cloud europe-west1, St. Ghislain

# The allowlist. pub = the `pub=` line of the repeater's repeater.key.
# roles: "observe" (feeds the map) and/or "bridge" (carries traffic between islands).
# Hotspots connect the same way; the hub bridges for them by the same rules.

[[repeater]]
callsign = "ON0RFG"             # repeater, Merchtem
pub = "9ebd58ba0191164815aecbcf39537b8108c0b4a737e82357311b2bb3282cb940"
roles = ["observe", "bridge"]

[[repeater]]
callsign = "OR7F-4"             # hotspot, coast
pub = "3cc11df930c56540e54ab7ee4f30bcbf52ae8c4bad195c280681e8c392ac1e9a"
roles = ["observe", "bridge"]

# Channels the portal decodes and shows: the ones the backbone nodes carry.
# Only keys that are genuinely published belong here; a hashtag channel's key
# is sha256("#name")[:16], so anyone who knows the name can read it.
[[channel]]
name = "Public"
psk = "izOH6cXN6mrJ5e26oRXNcg=="

[[channel]]
hashtag = "mesh"

[[channel]]
hashtag = "ora"

[[channel]]
hashtag = "pra"

[[channel]]
hashtag = "sysops"

[[channel]]
hashtag = "mbox"
