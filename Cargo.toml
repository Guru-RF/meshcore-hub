[workspace]
resolver = "3"
members = ["crates/proto", "crates/hubd", "crates/portal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Guru-RF/meshcore-hub"

[workspace.dependencies]
meshcore-proto = { path = "crates/proto" }
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
aes = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros", "io-util", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
axum = { version = "0.8", features = ["ws"] }
webauthn-rs = { version = "=0.5.5", features = ["conditional-ui"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
